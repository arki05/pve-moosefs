## Installed by libpve-storage-custom-moosefs-perl.
##
## pvestatd's default KillMode=control-group causes `systemctl restart pvestatd`
## to SIGKILL every process in pvestatd's cgroup, including mfsmount FUSE helpers
## that were spawned by storage activation. Killing mfsmount mid-flight corrupts
## the FUSE mount and cascades to every VM/LXC on MooseFS storage.
##
## KillMode=mixed sends SIGTERM/SIGKILL only to the main pvestatd process, leaving
## spawned children (mfsmount) alive across restarts. See upstream issue
## moosefs/pve-moosefs#60.
[Service]
KillMode=mixed
