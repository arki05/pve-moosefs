## Installed by libpve-storage-custom-moosefs-perl.
##
## pvedaemon's default KillMode=control-group causes `systemctl restart pvedaemon`
## to SIGKILL every process in pvedaemon's cgroup, including mfsbdev daemons and
## mfsmount FUSE helpers that were spawned by storage activation from pvedaemon.
## Killing them mid-flight:
##   - corrupts the FUSE mount (Transport endpoint is not connected)
##   - leaks MFS-level file locks, since mfsbdev never gets to send `unmap` —
##     subsequent map attempts then fail with "MFS file is locked", forcing the
##     plugin onto the slower FUSE fallback
##
## KillMode=mixed sends SIGTERM/SIGKILL only to the main pvedaemon process,
## leaving spawned children alive across restarts. Companion drop-in for
## pvestatd ships alongside this one.
[Service]
KillMode=mixed
